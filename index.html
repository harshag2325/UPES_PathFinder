<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UPES Pathfinder</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #252525;
      background: linear-gradient(135deg, #e8eef2, #f5f5f5);
    }

    .topbar {
      min-height: 68px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 20px;
      border-bottom: 1px solid #ddd;
    }

    .school {
      font-size: 11px;
      line-height: 1.2;
      color: #555;
      letter-spacing: .3px;
    }

    .topbar h1 {
      font-size: 30px;
      margin: 0;
      font-weight: 700;
    }

    .brand {
      font-size: 26px;
      font-weight: 700;
      color: #222;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(330px, 41%) minmax(0, 59%);
      gap: 16px;
      padding: 16px;
      min-height: calc(100vh - 68px);
    }

    .panel {
      background: rgba(255, 255, 255, .9);
      border-radius: 8px;
      box-shadow: 0 2px 12px #00000012;
      min-width: 0;
    }

    .controls {
      padding: 18px;
      overflow: auto;
    }

    .intro {
      margin: 0 0 12px;
      color: #555;
      font-size: 14px;
    }

    .node-info {
      font-size: 13px;
      line-height: 1.45;
      color: #555;
      background: #f5f6f7;
      border: 1px solid #e2e4e6;
      border-radius: 5px;
      padding: 10px;
      margin-bottom: 14px;
    }

    .node-info b {
      color: #333;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    label {
      font-size: 14px;
      margin-top: 4px;
    }

    input,
    select {
      width: 100%;
      height: 38px;
      border: 1px solid #d3d6d9;
      border-radius: 5px;
      background: white;
      padding: 7px 10px;
      font-size: 15px;
      color: #222;
    }

    button {
      margin-top: 10px;
      border: 0;
      border-radius: 5px;
      background: #e5e5e5;
      color: #222;
      padding: 12px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #d8d8d8;
    }

    #result {
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: normal;
      overflow-wrap: anywhere;
      margin-top: 14px;
      min-height: 52px;
      color: #333;
    }

    .map-panel {
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
    }

    .map-placeholder {
      max-width: 420px;
      text-align: center;
      color: #777;
      padding: 24px;
    }

    .map-placeholder strong {
      color: #444;
      font-size: 18px;
    }

    .map-placeholder p {
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 850px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .topbar h1 {
        font-size: 23px;
      }

      .school {
        font-size: 9px;
      }

      .brand {
        font-size: 20px;
      }
    }


    .layout {
      height: calc(100vh - 68px);
      min-height: 0
    }

    .map-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      overflow: hidden
    }

    .map-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 4px 12px;
      flex: 0 0 auto
    }

    .map-heading strong {
      font-size: 18px
    }

    #map-counts {
      color: #666;
      font-size: 12px;
      flex: 1
    }

    #fit-map {
      margin: 0;
      border: 1px solid #bbb;
      background: #fff;
      border-radius: 6px;
      padding: 7px 12px;
      cursor: pointer
    }

    .map-viewport {
      position: relative;
      flex: 1 1 auto;
      min-height: 300px;
      width: 100%;
      overflow: auto;
      background: #fff;
      border: 1px solid #e1e4e7;
      border-radius: 6px
    }

    .map-stage {
      position: relative;
      width: var(--map-width);
      height: var(--map-height);
      background: #fff;
      transform-origin: top left
    }

    .road-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      z-index: 1;
      pointer-events: none
    }

    .shape-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none
    }

    .map-shape {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      color: #111;
      text-align: center;
      font-size: 12px;
      line-height: 1.15;
      white-space: pre-line;
      overflow: hidden;
      pointer-events: none
    }

    .map-shape.ellipse {
      border-radius: 50%
    }

    .map-shape.rounded {
      border-radius: 12px
    }

    .map-shape:not(.ellipse):not(.rounded) {
      border-radius: 0
    }

    .road {
      fill: none;
      vector-effect: non-scaling-stroke
    }

    @media(max-width:850px) {
      .layout {
        height: auto;
        min-height: calc(100vh - 68px);
        grid-template-columns: 1fr
      }

      .map-panel {
        height: 70vh
      }
    }


    .map-zoom-controls {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto
    }

    .map-zoom-controls button {
      min-width: 34px;
      height: 32px;
      border: 1px solid #cbd2d8;
      background: #fff;
      border-radius: 6px;
      font-size: 18px;
      line-height: 1;
      cursor: pointer
    }

    .map-zoom-controls button:hover {
      background: #edf5ef;
      border-color: #80bd91
    }

    #zoom-level {
      min-width: 46px;
      text-align: center;
      color: #555;
      font-size: 12px;
      font-variant-numeric: tabular-nums
    }

    #fit-map {
      padding: 7px 10px
    }
  </style>

  <style>
    .active-route-glow,
    .active-route,
    .route-marker {
      pointer-events: none;
    }
  </style>


  \n<style>
    .map-node.route-node-focus {
      outline: 2px solid #55bd78;
      outline-offset: 2px;
      z-index: 5;
    }
  </style>

  <style id="reference-map-layout">
    .map-viewport {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      padding: 12px;
      box-sizing: border-box;
    }

    .map-stage {
      flex: 0 0 auto;
      margin: 0 auto;
      transform: none !important;
      transform-origin: top left;
    }

    .map-stage .map-node {
      color: #222;
      text-shadow: none;
    }
  </style>

  <style>
    /* Selected navigation route is a separate overlay above every campus block. */
    .route-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      z-index: 5;
      pointer-events: none;
    }

    .route-layer .active-route-glow,
    .route-layer .active-route,
    .route-layer .route-marker {
      pointer-events: none;
    }
  </style>

  <style id="node-picker-style">
    #sourceNode,
    #targetNode {
      width: 100%;
    }

    .node-picker-hint {
      display: block;
      margin: -5px 0 12px;
      color: #68727c;
      font-size: 12px;
    }
  </style>


  <style id="main-location-select-style">
    #sourceLocationSelect,
    #targetLocationSelect {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin: 6px 0 14px;
      padding: 12px 14px;
      border: 1px solid #cfd5da;
      border-radius: 7px;
      background: #fff;
      color: #222;
      font: inherit;
    }

    #sourceNode,
    #targetNode {
      margin-top: 6px;
    }
  </style>


  <style id="radio-location-picker-style">
    .location-picker-group {
      margin: 0 0 18px;
    }

    .location-picker-group>label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .mode-options {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
      margin: 7px 0 10px;
    }

    .mode-options label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 400;
      font-size: 13px;
      cursor: pointer;
    }

    .mode-options input[type="radio"] {
      width: auto;
      margin: 0;
      accent-color: #238b57;
    }

    .mode-panel[hidden] {
      display: none !important;
    }

    .mode-panel select,
    .mode-panel input[type="number"] {
      width: 100%;
      box-sizing: border-box;
    }
  </style>


  <style id="radio-mode-visibility-fix">
    .location-picker-group {
      margin: 0 0 18px;
    }

    .mode-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin: 8px 0 12px;
    }

    .mode-options label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }

    .mode-options input[type="radio"] {
      width: auto;
      margin: 0;
      accent-color: #238b57;
    }

    .mode-panel[hidden] {
      display: none !important;
    }

    .mode-panel select,
    .mode-panel input[type="number"] {
      width: 100%;
      box-sizing: border-box;
    }
  </style>


  <style id="travel-weather-time-controls">
    .choice-group {
      margin: 0 0 18px;
    }

    .choice-group>label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .mode-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 22px;
      margin: 8px 0 10px;
    }

    .mode-options label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      font-weight: 400;
    }

    .mode-options input[type="radio"] {
      width: auto;
      margin: 0;
      accent-color: #238b57;
    }

    .time-range-labels {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 8px 0;
    }

    .time-range-labels strong {
      font-size: 14px;
    }

    .time-choice input[type="range"] {
      display: block;
      width: 100%;
      accent-color: #238b57;
    }

    .time-range-ticks {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      opacity: .7;
      margin-top: 5px;
    }
  </style>


<style id="pathfinder-form-polish">
  /* Refined controls panel: consistent spacing, alignment and readable inputs. */
  .controls {
    padding: 22px;
    border: 1px solid #e7ebee;
    border-radius: 12px;
    background: rgba(255,255,255,.96);
  }

  .controls .intro {
    font-size: 14px;
    line-height: 1.55;
    margin: 0 0 22px;
    color: #66717b;
  }

  #routeForm {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  #routeForm .location-picker-group,
  #routeForm .choice-group {
    margin: 0 0 22px;
    padding: 0 0 18px;
    border-bottom: 1px solid #edf0f2;
  }

  #routeForm .location-picker-group > label,
  #routeForm .choice-group > label {
    display: block;
    margin: 0 0 12px;
    color: #26323b;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.35;
  }

  #routeForm .mode-options {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    column-gap: 22px;
    row-gap: 10px;
    margin: 0 0 14px;
  }

  #routeForm .mode-options label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    color: #46515b;
    font-size: 14px;
    line-height: 1.4;
    font-weight: 400;
    cursor: pointer;
  }

  #routeForm input[type="radio"] {
    appearance: auto;
    width: 16px;
    min-width: 16px;
    height: 16px;
    margin: 0;
    padding: 0;
    accent-color: #15965b;
    cursor: pointer;
  }

  #routeForm .mode-panel select,
  #routeForm .mode-panel input[type="number"] {
    display: block;
    width: 100%;
    height: 46px;
    min-height: 46px;
    margin: 0;
    padding: 0 14px;
    border: 1px solid #d5dce2;
    border-radius: 8px;
    background-color: #fff;
    color: #29343d;
    font-family: inherit;
    font-size: 14px;
    line-height: normal;
    box-shadow: 0 1px 2px rgba(20,35,50,.03);
  }

  #routeForm .mode-panel select:focus,
  #routeForm .mode-panel input[type="number"]:focus {
    outline: none;
    border-color: #15965b;
    box-shadow: 0 0 0 3px rgba(21,150,91,.12);
  }

  #routeForm .choice-group .mode-options {
    margin: 0;
    min-height: 24px;
  }

  #routeForm .time-choice {
    margin-bottom: 20px;
    padding-bottom: 18px;
  }

  #routeForm .time-range-labels {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 0 0 10px;
    color: #77828b;
    font-size: 12px;
  }

  #routeForm .time-range-labels strong {
    color: #168653;
    font-size: 15px;
    font-weight: 700;
  }

  #routeForm input[type="range"] {
    display: block;
    width: 100%;
    height: 20px;
    margin: 0;
    padding: 0;
    accent-color: #15965b;
    cursor: pointer;
  }

  #routeForm .time-range-ticks {
    display: flex;
    justify-content: space-between;
    margin-top: 5px;
    color: #89939b;
    font-size: 11px;
  }

  #findPathBtn {
    width: 100%;
    min-height: 46px;
    margin: 0;
    padding: 12px 18px;
    border: 0;
    border-radius: 8px;
    background: #15965b;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .1px;
    box-shadow: 0 3px 8px rgba(21,150,91,.18);
    transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
  }

  #findPathBtn:hover {
    background: #107d4b;
    box-shadow: 0 4px 11px rgba(21,150,91,.22);
  }

  #findPathBtn:active { transform: translateY(1px); }

  #result {
    margin-top: 16px;
    padding: 12px;
    border-radius: 8px;
    background: #f6f8f9;
    border: 1px solid #e8edf0;
  }

  @media (max-width: 850px) {
    .controls { padding: 18px; }
    #routeForm .location-picker-group,
    #routeForm .choice-group { margin-bottom: 18px; padding-bottom: 15px; }
  }
</style>

</head>

<body>
  <header class="topbar">
    <div class="school">SCHOOL OF<br><b>COMPUTER SCIENCE</b></div>
    <h1>Pathfinder</h1>
    <div class="brand">◉UPES</div>
  </header>

  <main class="layout">
    <section class="panel controls">
      <p class="intro">Find a route across the UPES campus using the campus graph.</p>

      <form id="routeForm">
        <div class="location-picker-group">
          <label>Start location</label>
          <div class="mode-options">
            <label><input type="radio" name="sourceMode" value="main" checked> Main campus location</label>
            <label><input type="radio" name="sourceMode" value="node"> Enter node number</label>
          </div>
          <div id="sourceMainMode" class="mode-panel">
            <select id="sourceLocationSelect">

              <option value="0" selected>Main Gate (Node 0)</option>
              <option value="0">Main Gate (Node 0)</option>
              <option value="231">Hubble (Node 231)</option>
              <option value="11">MAC/GYM (Node 11)</option>
              <option value="5">Enrollment Office (Node 5)</option>
              <option value="56">1st Block (Node 56)</option>
              <option value="75">2nd Block (Node 75)</option>
              <option value="73">3rd Block (Node 73)</option>
              <option value="83">4th Block (Node 83)</option>
              <option value="87">5th Block (Node 87)</option>
              <option value="98">6th Block (Node 98)</option>
              <option value="94">7th Block (Node 94)</option>
              <option value="94">8th Block (Node 94)</option>
              <option value="182">9th Block (Node 182)</option>
              <option value="190">10th Block (Node 190)</option>
              <option value="214">11th Block (Node 214)</option>
              <option value="157">Boys Hostel (Node 157)</option>
              <option value="153">Laboratory (Node 153)</option>
              <option value="23">Gandhi Chowk (Node 23)</option>
              <option value="162">Tulip (Node 162)</option>
              <option value="62">Amphitheater 1 (Node 62)</option>
              <option value="186">Amphitheater 2 (Node 186)</option>
              <option value="3">Fire Station (Node 3)</option>
              <option value="92">IT Tower (Node 92)</option>
              <option value="70">Food Court 1 (Node 70)</option>
              <option value="101">Food Court 2 (Node 101)</option>
              <option value="137">Girls Hostel (Node 137)</option>
              <option value="128">Playground (Node 128)</option>
              <option value="129">Team Orange (Node 129)</option>
              <option value="223">Frisco (Node 223)</option>

            </select>
          </div>
          <div id="sourceNodeMode" class="mode-panel" hidden>
            <input type="number" id="sourceNode" min="0" max="239" placeholder="Enter start node number"
              autocomplete="off" disabled>
          </div>
        </div>

        <div class="location-picker-group">
          <label>Destination</label>
          <div class="mode-options">
            <label><input type="radio" name="targetMode" value="main" checked> Main campus location</label>
            <label><input type="radio" name="targetMode" value="node"> Enter node number</label>
          </div>
          <div id="targetMainMode" class="mode-panel">
            <select id="targetLocationSelect">

              <option value="0" selected>Main Gate (Node 0)</option>
              <option value="0">Main Gate (Node 0)</option>
              <option value="231">Hubble (Node 231)</option>
              <option value="11">MAC/GYM (Node 11)</option>
              <option value="5">Enrollment Office (Node 5)</option>
              <option value="56">1st Block (Node 56)</option>
              <option value="75">2nd Block (Node 75)</option>
              <option value="73">3rd Block (Node 73)</option>
              <option value="83">4th Block (Node 83)</option>
              <option value="87">5th Block (Node 87)</option>
              <option value="98">6th Block (Node 98)</option>
              <option value="94">7th Block (Node 94)</option>
              <option value="94">8th Block (Node 94)</option>
              <option value="182">9th Block (Node 182)</option>
              <option value="190">10th Block (Node 190)</option>
              <option value="214">11th Block (Node 214)</option>
              <option value="157">Boys Hostel (Node 157)</option>
              <option value="153">Laboratory (Node 153)</option>
              <option value="23">Gandhi Chowk (Node 23)</option>
              <option value="162">Tulip (Node 162)</option>
              <option value="62">Amphitheater 1 (Node 62)</option>
              <option value="186">Amphitheater 2 (Node 186)</option>
              <option value="3">Fire Station (Node 3)</option>
              <option value="92">IT Tower (Node 92)</option>
              <option value="70">Food Court 1 (Node 70)</option>
              <option value="101">Food Court 2 (Node 101)</option>
              <option value="137">Girls Hostel (Node 137)</option>
              <option value="128">Playground (Node 128)</option>
              <option value="129">Team Orange (Node 129)</option>
              <option value="223">Frisco (Node 223)</option>

            </select>
          </div>
          <div id="targetNodeMode" class="mode-panel" hidden>
            <input type="number" id="targetNode" min="0" max="239" placeholder="Enter destination node number"
              autocomplete="off" disabled>
          </div>
        </div>

        <div class="choice-group">
          <label>Travel mode</label>
          <div class="mode-options">
            <label><input type="radio" name="travelMode" value="0"> Car</label>
            <label><input type="radio" name="travelMode" value="1" checked> Walk</label>
          </div>
          <input type="hidden" id="typeNode" value="1">
        </div>

        <div class="choice-group">
          <label>Weather</label>
          <div class="mode-options">
            <label><input type="radio" name="weatherMode" value="1"> Rainy</label>
            <label><input type="radio" name="weatherMode" value="0" checked> Dry</label>
          </div>
          <input type="hidden" id="weather_type" value="0">
        </div>

        <div class="choice-group time-choice">
          <label for="time_type">Time of travel</label>
          <div class="time-range-labels">
            <span>12 AM</span>
            <strong id="selectedTimeLabel">8:00 AM</strong>
            <span>11 PM</span>
          </div>
          <input type="range" id="time_type" min="0" max="23" step="1" value="8" required>
          <div class="time-range-ticks">
            <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>23:00</span>
          </div>
        </div>

        <button id="findPathBtn" type="button">Find Path</button>
      </form>

      <div id="result" class="result" aria-live="polite"></div>
    </section>

    <section class="panel map-panel" aria-label="Campus map">
      <div class="map-heading">
        <strong>UPES Campus Map</strong>
        <span id="map-counts">Loading map…</span>
        <div class="map-zoom-controls" aria-label="Map zoom controls">
          <button id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
          <span id="zoom-level">100%</span>
          <button id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out">−</button>
          <button id="fit-map" type="button">Fit map</button>
        </div>
      </div>
      <div class="map-viewport" id="map-viewport">
        <div class="map-stage" id="map-stage"><svg class="road-layer" id="road-layer" aria-hidden="true"></svg>
          <div class="shape-layer" id="shape-layer"></div>
          <svg class="route-layer" id="route-layer" aria-hidden="true"></svg>
        </div>
      </div>
    </section>

  <script>
    // Draw.io-derived campus map geometry and viewport controls.
    (function () {
      const stage = document.getElementById("map-stage");
      const roadLayer = document.getElementById("road-layer");
      const shapeLayer = document.getElementById("shape-layer");
      const counts = document.getElementById("map-counts");
      const viewport = document.getElementById("map-viewport");
      const zoomLabel = document.getElementById("zoom-level");

      let currentZoom = 1;
      const MIN_ZOOM = 0.25;
      const MAX_ZOOM = 5;

      stage.style.width = MAP_DATA.width + "px";
      stage.style.height = MAP_DATA.height + "px";
      stage.style.transform = "none";
      stage.style.zoom = "1";

      roadLayer.setAttribute("viewBox", `0 0 ${MAP_DATA.width} ${MAP_DATA.height}`);
      roadLayer.setAttribute("preserveAspectRatio", "none");

      const svgNS = "http://www.w3.org/2000/svg";
      for (const edge of MAP_DATA.edges) {
        const path = document.createElementNS(svgNS, "polyline");
        path.setAttribute("points", edge.points.map(p => `${p[0]},${p[1]}`).join(" "));
        path.setAttribute("class", "road");
        path.setAttribute("stroke", edge.style.stroke || "#555");
        path.setAttribute("stroke-width", edge.style.strokeWidth || 1);
        path.setAttribute("stroke-linecap", edge.style.rounded ? "round" : "butt");
        path.setAttribute("stroke-linejoin", edge.style.rounded ? "round" : "miter");
        if (edge.style.dashed) path.setAttribute("stroke-dasharray", "5 4");
        roadLayer.appendChild(path);
      }

      for (const item of MAP_DATA.vertices) {
        const el = document.createElement("div");
        const isNumberedNode = /^\d+$/.test(String(item.label).trim());
        el.className = "map-shape" +
          (isNumberedNode ? " map-node" : "") +
          (item.style.ellipse ? " ellipse" : "") +
          (item.style.rounded ? " rounded" : "");
        if (isNumberedNode) el.dataset.nodeId = String(item.label).trim();
        el.style.left = item.x + "px";
        el.style.top = item.y + "px";
        el.style.width = item.w + "px";
        el.style.height = item.h + "px";
        el.style.background = item.style.fill === "none" ? "transparent" : item.style.fill;
        el.style.border = `${item.style.strokeWidth}px ${item.style.dashed ? "dashed" : "solid"} ${item.style.stroke}`;
        el.style.opacity = Math.max(0, Math.min(1, item.style.opacity / 100));
        el.textContent = item.label;
        el.title = item.label || item.id;
        shapeLayer.appendChild(el);
      }

      counts.textContent = `${MAP_DATA.vertices.length} shapes · ${MAP_DATA.edges.length} lines`;

      function applyZoom(nextZoom, centerPoint) {
        const oldCenter = {
          x: (viewport.scrollLeft + viewport.clientWidth / 2) / currentZoom,
          y: (viewport.scrollTop + viewport.clientHeight / 2) / currentZoom
        };
        currentZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, nextZoom));

        stage.style.width = MAP_DATA.width + "px";
        stage.style.height = MAP_DATA.height + "px";
        stage.style.zoom = String(currentZoom);

        if (zoomLabel) zoomLabel.textContent = `${Math.round(currentZoom * 100)}%`;

        const focus = centerPoint || oldCenter;
        requestAnimationFrame(() => {
          viewport.scrollLeft = Math.max(0, focus.x * currentZoom - viewport.clientWidth / 2);
          viewport.scrollTop = Math.max(0, focus.y * currentZoom - viewport.clientHeight / 2);
        });
      }

      function fitMap() {
        const availableW = Math.max(100, viewport.clientWidth - 40);
        const availableH = Math.max(100, viewport.clientHeight - 40);
        const scale = Math.min(availableW / MAP_DATA.width, availableH / MAP_DATA.height);
        currentZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, scale));
        stage.style.width = MAP_DATA.width + "px";
        stage.style.height = MAP_DATA.height + "px";
        stage.style.zoom = String(currentZoom);
        if (zoomLabel) zoomLabel.textContent = `${Math.round(currentZoom * 100)}%`;
        requestAnimationFrame(() => {
          viewport.scrollLeft = Math.max(0, (MAP_DATA.width * currentZoom - viewport.clientWidth) / 2);
          viewport.scrollTop = Math.max(0, (MAP_DATA.height * currentZoom - viewport.clientHeight) / 2);
        });
      }

      function focusRouteOnMap(path) {
        if (!Array.isArray(path) || !path.length) return;
        const byId = new Map();
        MAP_DATA.vertices.forEach(item => {
          const label = String(item.label).trim();
          if (/^\d+$/.test(label)) {
            byId.set(Number(label), {
              x: item.x + item.w / 2,
              y: item.y + item.h / 2
            });
          }
        });
        const points = path.map(id => byId.get(Number(id))).filter(Boolean);
        if (!points.length) return;

        const minX = Math.min(...points.map(p => p.x));
        const maxX = Math.max(...points.map(p => p.x));
        const minY = Math.min(...points.map(p => p.y));
        const maxY = Math.max(...points.map(p => p.y));
        const routeW = Math.max(120, maxX - minX);
        const routeH = Math.max(120, maxY - minY);
        const availableW = Math.max(120, viewport.clientWidth - 100);
        const availableH = Math.max(120, viewport.clientHeight - 100);
        const routeZoom = Math.min(availableW / (routeW * 1.2), availableH / (routeH * 1.2), 4.5);
        applyZoom(Math.max(0.3, Math.min(MAX_ZOOM, routeZoom)), {
          x: (minX + maxX) / 2,
          y: (minY + maxY) / 2
        });
      }

      document.getElementById("fit-map").addEventListener("click", fitMap);
      document.getElementById("zoom-in").addEventListener("click", () => applyZoom(currentZoom * 1.2));
      document.getElementById("zoom-out").addEventListener("click", () => applyZoom(currentZoom / 1.2));

      window.focusRouteOnMap = focusRouteOnMap;
      window.zoomCampusMap = applyZoom;
      window.fitCampusMap = fitMap;

      fitMap();
      window.addEventListener("resize", fitMap);
    })();
  </script>

  <script>
    // Radio choices toggle between a named campus location and manual node ID.
    document.addEventListener("DOMContentLoaded", () => {
      const configs = [
        {
          name: "sourceMode",
          selectId: "sourceLocationSelect",
          inputId: "sourceNode",
          mainPanelId: "sourceMainMode",
          nodePanelId: "sourceNodeMode"
        },
        {
          name: "targetMode",
          selectId: "targetLocationSelect",
          inputId: "targetNode",
          mainPanelId: "targetMainMode",
          nodePanelId: "targetNodeMode"
        }
      ];

      configs.forEach(config => {
        const select = document.getElementById(config.selectId);
        const input = document.getElementById(config.inputId);
        const mainPanel = document.getElementById(config.mainPanelId);
        const nodePanel = document.getElementById(config.nodePanelId);
        const radios = document.querySelectorAll(`input[name="${config.name}"]`);

        function updateMode() {
          const mode = document.querySelector(`input[name="${config.name}"]:checked`).value;
          const useMain = mode === "main";

          mainPanel.hidden = !useMain;
          nodePanel.hidden = useMain;
          select.disabled = !useMain;
          input.disabled = useMain;

          if (useMain) {
            input.value = select.value;
            select.required = true;
            input.required = false;
          } else {
            select.required = false;
            input.required = true;
            input.value = "";
          }
        }

        select.addEventListener("change", () => {
          input.value = select.value;
        });
        radios.forEach(radio => radio.addEventListener("change", updateMode));
        updateMode();
      });
    });
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Keep the existing routing logic's input IDs and numeric values.
      document.querySelectorAll('input[name="travelMode"]').forEach(radio => {
        radio.addEventListener("change", () => {
          document.getElementById("typeNode").value = radio.value;
        });
      });

      document.querySelectorAll('input[name="weatherMode"]').forEach(radio => {
        radio.addEventListener("change", () => {
          document.getElementById("weather_type").value = radio.value;
        });
      });

      const timeSlider = document.getElementById("time_type");
      const timeLabel = document.getElementById("selectedTimeLabel");

      function formatHour(hourValue) {
        const hour = Number(hourValue);
        const suffix = hour < 12 ? "AM" : "PM";
        const displayHour = hour % 12 || 12;
        return `${displayHour}:00 ${suffix}`;
      }

      function updateTimeLabel() {
        timeLabel.textContent = formatHour(timeSlider.value);
      }

      timeSlider.addEventListener("input", updateTimeLabel);
      updateTimeLabel();
    });
  </script>
